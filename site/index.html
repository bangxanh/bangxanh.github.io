<html lang="vi">

<meta name="keywords" content="học online, trắc nghiệm online, ôn thi tốt nghiệp THPT 2027, ôn thi vào lớp 10, Kết nối tri thức, tóm tắt kiến thức, lớp 1, lớp 6, lớp 9, lớp 12">
<meta name="theme-color" content="#1f5640">
<meta property="og:type" content="website">
<meta property="og:title" content="Bảng Xanh – Học tập miễn phí lớp 1 – 12">
<meta property="og:description" content="Kiến thức trọng tâm theo chương, trắc nghiệm online 3 dạng câu hỏi mới, đề luyện thi, tin giáo dục cập nhật hằng ngày.">
<meta property="og:image" content="icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%231f5640%27/%3E%3Crect x=%274%27 y=%274%27 width=%2724%27 height=%2724%27 rx=%275%27 fill=%27%23e8b440%27/%3E%3Ctext x=%2716%27 y=%2721%27 font-family=%27Arial%27 font-weight=%27700%27 font-size=%2712%27 text-anchor=%27middle%27 fill=%27%231f5640%27%3EBX%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Bảng Xanh — màu bảng xanh lớp học và phấn vàng.
   Bố cục: thanh điều hướng màu bảng bên trái, nội dung dạng thẻ bên phải; điện thoại: menu trượt. */
:root{
  --bg:#f2f5f3; --surface:#ffffff; --surface-2:#edf2ef; --ink:#14211b; --muted:#56675e; --line:#d9e2dc;
  --board:#1f5640; --board-2:#2a7254; --board-ink:#ffffff; --chalk:#e8b440; --chalk-ink:#3a2a04;
  --side-bg:#1b4a37; --side-ink:#eef6f1; --side-muted:#a9c7b8; --side-hover:rgba(255,255,255,.08); --side-on:rgba(232,180,64,.18);
  --good:#1b8752; --fair:#2b68d6; --warn:#b8750c; --bad:#c03838;
  --s-toan:#2f6fde; --s-van:#c93a58; --s-anh:#0b879a; --s-khtn:#55891b; --s-khxh:#bd7a12;
  --font:'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --mono:ui-monospace, 'Cascadia Mono', Consolas, Menlo, monospace;
  --r:12px; --r-sm:8px;
  --shadow:0 1px 2px rgba(20,33,27,.06), 0 6px 18px rgba(20,33,27,.05);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1511; --surface:#141f19; --surface-2:#1a2720; --ink:#e3ebe6; --muted:#9bb0a4; --line:#283a30;
    --board:#3f9a73; --board-2:#58b48b; --board-ink:#04130b; --chalk:#f0c45a; --chalk-ink:#2a1f02;
    --side-bg:#101c16; --side-ink:#e3ebe6; --side-muted:#8ea89a; --side-hover:rgba(255,255,255,.06); --side-on:rgba(240,196,90,.14);
    --good:#41c07f; --fair:#6c9df0; --warn:#e2a63b; --bad:#ec6d6d;
    --s-toan:#6c9df0; --s-van:#ea7290; --s-anh:#3cc1d2; --s-khtn:#95c652; --s-khxh:#e6aa4c;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1511; --surface:#141f19; --surface-2:#1a2720; --ink:#e3ebe6; --muted:#9bb0a4; --line:#283a30;
  --board:#3f9a73; --board-2:#58b48b; --board-ink:#04130b; --chalk:#f0c45a; --chalk-ink:#2a1f02;
  --side-bg:#101c16; --side-ink:#e3ebe6; --side-muted:#8ea89a; --side-hover:rgba(255,255,255,.06); --side-on:rgba(240,196,90,.14);
  --good:#41c07f; --fair:#6c9df0; --warn:#e2a63b; --bad:#ec6d6d;
  --s-toan:#6c9df0; --s-van:#ea7290; --s-anh:#3cc1d2; --s-khtn:#95c652; --s-khxh:#e6aa4c;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
#app{min-height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--font);-webkit-font-smoothing:antialiased}
h1,h2,h3{line-height:1.25;margin:0;text-wrap:balance;font-weight:700}
h1{font-size:1.75rem;letter-spacing:-.01em}
h2{font-size:1.1rem}
h3{font-size:1rem}
p{margin:0}
a{color:var(--board)}
button{font:inherit;color:inherit}
code,.mono{font-family:var(--mono);font-size:.92em}
.ic{width:18px;height:18px;flex:none}
:focus-visible{outline:3px solid var(--chalk);outline-offset:2px;border-radius:6px}
.muted{color:var(--muted)} .small{font-size:.86rem}
.err{color:var(--bad);font-size:.9rem;min-height:1.2em} .ok-text{color:var(--good)}
.boot,.loading{padding:48px;text-align:center;color:var(--muted)}
.empty{padding:28px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}
.empty.small{padding:14px;font-size:.9rem;border:0}
.eyebrow{font-size:.78rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.prose{max-width:72ch} .prose b{font-weight:700}
sup,sub{font-size:.72em;line-height:0}

/* nút, ô nhập */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 16px;border-radius:10px;border:1px solid transparent;background:var(--surface-2);color:var(--ink);font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .15s,border-color .15s,transform .05s}
.btn:hover{border-color:var(--line)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--board);color:var(--board-ink)}
.btn.primary:hover{background:var(--board-2)}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{background:var(--bad);color:#fff}
.btn.danger.ghost{background:transparent;color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.btn.sm{padding:6px 12px;font-size:.86rem}
.btn.lg{padding:12px 22px;font-size:1.02rem}
.btn.block{width:100%}
.icon-btn{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:9px;border:0;background:transparent;cursor:pointer;color:inherit}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn.danger{color:var(--bad)}
.linkish{background:none;border:0;padding:0;color:var(--board);font-weight:600;cursor:pointer;text-decoration:none}
.linkish:hover{text-decoration:underline}
.linkish.danger{color:var(--bad)}
.input{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit;min-width:0}
.input:focus{outline:none;border-color:var(--board);box-shadow:0 0 0 3px color-mix(in srgb,var(--board) 22%,transparent)}
.input.lg{font-size:1.1rem;padding:11px 14px}
.input.sm{width:auto;padding:6px 8px}
textarea.input{resize:vertical;line-height:1.5}
select.input{cursor:pointer}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span{font-size:.86rem;font-weight:600;color:var(--muted)}
.check{display:inline-flex;gap:8px;align-items:center;cursor:pointer}
.check input,.done-toggle input{width:17px;height:17px;accent-color:var(--board)}
.stack{display:flex;flex-direction:column;gap:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.row-btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.file-btn{position:relative;overflow:hidden}
.file-btn input{position:absolute;inset:0;opacity:0;cursor:pointer}

/* nhãn */
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:.76rem;font-weight:600;background:color-mix(in srgb,var(--c,var(--board)) 14%,transparent);color:color-mix(in srgb,var(--c,var(--board)) 85%,var(--ink));white-space:nowrap}
.badge.soft{background:var(--surface-2);color:var(--muted)}
.badge.exam{--c:var(--chalk)}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.78rem;font-weight:600;border:0;white-space:nowrap}
.pill.green{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.pill.gray{background:var(--surface-2);color:var(--muted)}
.pill.red{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.pill.amber{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.pill.as-btn{cursor:pointer}
.score{display:inline-block;min-width:3.2em;text-align:center;padding:1px 8px;border-radius:7px;font-weight:700;font-variant-numeric:tabular-nums}
.score.good{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.score.fair{background:color-mix(in srgb,var(--fair) 16%,transparent);color:var(--fair)}
.score.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.score.bad{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}

/* thương hiệu */
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{display:grid;place-items:center;width:38px;height:38px;border-radius:10px;background:var(--chalk);color:var(--chalk-ink);font-weight:800;letter-spacing:.02em;flex:none;box-shadow:inset 0 -3px 0 rgba(0,0,0,.12)}
.brand b{display:block;font-size:1.05rem;line-height:1.2}
.brand small{display:block;font-size:.76rem;opacity:.75;line-height:1.3}

/* đăng nhập */
.auth-wrap{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr;}
.auth-wrap.single{grid-template-columns:1fr;place-items:center;padding:24px}
.auth-side{background:var(--side-bg);color:var(--side-ink);padding:48px clamp(24px,5vw,72px);display:flex;flex-direction:column;gap:28px;justify-content:center;
  background-image:radial-gradient(circle at 15% 20%,rgba(255,255,255,.06),transparent 40%),radial-gradient(circle at 85% 80%,rgba(232,180,64,.08),transparent 45%)}
.auth-side h1{font-size:clamp(1.6rem,3vw,2.3rem);max-width:18ch}
.auth-points{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:16px;max-width:46ch}
.auth-points li{display:flex;gap:12px;align-items:flex-start;color:var(--side-muted)}
.auth-points b{color:var(--side-ink)}
.auth-points .ic{color:var(--chalk);margin-top:3px}
.auth-foot{color:var(--side-muted);font-size:.85rem}
.auth-card{align-self:center;justify-self:center;width:min(440px,calc(100% - 32px));background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:18px;margin:32px 0}
.auth-card.wide{width:min(560px,100%)}
.demo-box{background:var(--surface-2);border-radius:10px;padding:12px 14px;font-size:.9rem;line-height:1.9}

/* khung */
.shell{display:grid;grid-template-columns:252px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--side-bg);color:var(--side-ink);display:flex;flex-direction:column;padding:18px 14px;gap:18px;overflow-y:auto}
.side .brand{padding:4px 6px 8px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:10px;color:var(--side-muted);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--side-hover);color:var(--side-ink)}
.nav a.on{background:var(--side-on);color:var(--side-ink);font-weight:600;box-shadow:inset 3px 0 0 var(--chalk)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.me{display:flex;align-items:center;gap:10px;padding:8px;border-radius:12px;background:var(--side-hover)}
.me .icon-btn{color:var(--side-muted)} .me .icon-btn:hover{background:var(--side-hover);color:var(--side-ink)}
.me-txt{min-width:0;flex:1} .me-txt b{display:block;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .me-txt small{color:var(--side-muted);font-size:.76rem}
.avatar{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--chalk);color:var(--chalk-ink);font-weight:700;font-size:.82rem;flex:none}
.avatar.sm{width:30px;height:30px;font-size:.72rem}
.mode-pill{font-size:.74rem;color:var(--side-muted);padding:0 8px}
.mode-pill.local::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--chalk);margin-right:6px;vertical-align:1px}
.mode-pill.server::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#59d69a;margin-right:6px;vertical-align:1px}
.main-wrap{min-width:0}
.topbar{display:none}
.side-scrim{display:none}
.page{max-width:1160px;margin:0 auto;padding:28px clamp(16px,3vw,36px) 64px;display:flex;flex-direction:column;gap:20px}
.page.narrow{max-width:820px}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.page-head>div{max-width:75ch;display:flex;flex-direction:column;gap:6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.card-head h2{display:flex;align-items:center;gap:8px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.cols.wide-left{grid-template-columns:1.6fr 1fr}
.callout{background:var(--surface-2);border-left:4px solid var(--board);padding:12px 16px;border-radius:0 10px 10px 0}
.callout.warn{border-left-color:var(--warn);background:color-mix(in srgb,var(--warn) 10%,var(--surface))}
.filters,.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.toolbar{justify-content:space-between}
.filters .input{width:auto}
.searchbox{position:relative;flex:1;min-width:220px;max-width:420px}
.searchbox .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.searchbox .input{padding-left:36px;width:100%}
.page-head .searchbox{max-width:380px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{display:inline-flex;align-items:center;gap:7px;padding:10px 14px;border:0;background:none;border-bottom:3px solid transparent;color:var(--muted);font-weight:600;cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);border-bottom-color:var(--chalk)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg-btn{border:0;background:none;padding:6px 12px;border-radius:8px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg-btn.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);padding:5px 12px;border-radius:999px;cursor:pointer;font-weight:500;font-size:.9rem}
.chip:hover{border-color:var(--board)}
.chip.on{background:var(--board);border-color:var(--board);color:var(--board-ink)}
.chip small{opacity:.7}
.bar{display:block;height:6px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c,var(--board));border-radius:999px}
.plain-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.pl-row{display:flex;align-items:center;gap:12px;padding:10px 6px;border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left;color:inherit;text-decoration:none;cursor:pointer;border-radius:0}
.plain-list li:last-child .pl-row,.plain-list li.pl-row:last-child{border-bottom:0}
button.pl-row:hover,a.pl-row:hover{background:var(--surface-2)}
.pl-row.on{background:var(--surface-2)}
.pl-row b{display:block;font-weight:600} .pl-row small{display:block;color:var(--muted);font-size:.84rem}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.facts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.facts li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.facts li:last-child{border-bottom:0}
.facts span{color:var(--muted)}
.facts.inline{flex-direction:row;flex-wrap:wrap;gap:6px 22px}
.facts.inline li{flex-direction:column;gap:0;border:0;padding:0}
.facts.inline span{font-size:.8rem}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.table{width:100%;border-collapse:collapse;font-size:.92rem}
.table th{text-align:left;font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
.table td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.table tr:last-child td{border-bottom:0}
.table .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.table .acts{white-space:nowrap;text-align:right}
.table .acts>*{margin-left:4px}
.me-row td{background:color-mix(in srgb,var(--chalk) 12%,transparent)}
.rank{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--surface-2);font-weight:700;font-size:.85rem}
.rank.r1{background:#e8b440;color:#3a2a04}.rank.r2{background:#c9d3cf;color:#22302a}.rank.r3{background:#d89a6a;color:#3a1d05}

/* trang chủ */
.hero{display:flex;justify-content:space-between;align-items:stretch;gap:20px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px 26px}
.hero>div:first-child{display:flex;flex-direction:column;gap:6px}
.hero-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.countdown{display:flex;align-items:center;gap:14px;background:var(--side-bg);color:var(--side-ink);border-radius:14px;padding:16px 22px;border:1px solid color-mix(in srgb,var(--chalk) 30%,transparent)}
.cd-num{font-size:2.8rem;font-weight:800;color:var(--chalk);font-variant-numeric:tabular-nums;line-height:1}
.cd-lab{font-size:.88rem;line-height:1.4;color:var(--side-muted)} .cd-lab b{color:var(--side-ink);display:block} .cd-lab small{display:block}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:2px;border-top:3px solid var(--line)}
.kpi-lab{font-size:.82rem;color:var(--muted);font-weight:600}
.kpi-val{font-size:1.75rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi-sub{font-size:.8rem;color:var(--muted)}
.kpi.good{border-top-color:var(--good)} .kpi.fair{border-top-color:var(--fair)} .kpi.warn{border-top-color:var(--warn)} .kpi.bad{border-top-color:var(--bad)}
.subj-mini{display:grid;grid-template-columns:1fr;gap:8px}
.sm-item{display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"n s m" "b b b";gap:4px 10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-left:4px solid var(--c);border-radius:10px;background:var(--surface);cursor:pointer;text-align:left}
.sm-item:hover{background:var(--surface-2)}
.sm-name{grid-area:n;font-weight:700}.sm-sub{grid-area:s;color:var(--muted);font-size:.84rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sm-meta{grid-area:m;font-size:.8rem;color:var(--muted)}.sm-item .bar{grid-area:b}
.news{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:4px}
.news:first-of-type{border-top:0;padding-top:0}
.news h3{display:flex;gap:8px;align-items:center}
.news.pinned h3 .badge{--c:var(--chalk)}

/* học liệu */
.levels{display:grid;grid-template-columns:1.2fr 1fr .8fr;gap:12px}
.lv{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.lv-name{font-weight:700;font-size:.82rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.subj-cards{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.subj-card{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer;border-top:4px solid var(--c);min-width:0}
.subj-card:hover{background:var(--surface-2)}
.subj-card.on{border-color:var(--c);box-shadow:0 0 0 2px color-mix(in srgb,var(--c) 35%,transparent)}
.sc-tag{font-weight:800;color:var(--c);font-size:.95rem}
.sc-name{font-size:.88rem;line-height:1.35;min-height:2.6em}
.sc-meta{font-size:.78rem;color:var(--muted)}
.reader{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 24px;display:flex;flex-direction:column;gap:16px;border-top:5px solid var(--c)}
.reader-head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap}
.reader-head h2{font-size:1.45rem}
.chapters{display:flex;flex-direction:column;gap:12px}
.chap{border:1px solid var(--line);border-radius:12px;padding:14px 18px;background:var(--surface);transition:background .2s}
.chap.done{background:color-mix(in srgb,var(--good) 6%,var(--surface));border-color:color-mix(in srgb,var(--good) 30%,var(--line))}
.chap.flash{animation:flash 1.6s ease}
@keyframes flash{0%,40%{box-shadow:0 0 0 3px var(--chalk)}100%{box-shadow:none}}
.chap-head{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.chap-head h3{flex:1;font-size:1.02rem}
.chap-no{font-weight:800;color:var(--c);font-variant-numeric:tabular-nums;font-size:.95rem;min-width:2ch}
.done-toggle{display:inline-flex;align-items:center;gap:6px;font-size:.84rem;color:var(--muted);cursor:pointer;white-space:nowrap}
.points{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:5px;max-width:90ch}
.points li::marker{color:var(--c)}
.lesson{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:6px}
.lesson:first-of-type{border-top:0;padding-top:0}
.search-res .pl-row small{white-space:normal}

/* tài liệu */
.doclist{display:flex;flex-direction:column;gap:10px}
.doc{display:flex;gap:14px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.doc-ic{display:grid;place-items:center;width:42px;height:42px;border-radius:10px;background:var(--surface-2);flex:none;color:var(--board)}
.doc-ic.file{color:var(--s-van)} .doc-ic.text{color:var(--s-khxh)}
.doc-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.doc-act{flex:none}

/* biểu đồ */
.chart{width:100%;height:auto;display:block}
.ch-grid{stroke:var(--line);stroke-width:1}
.ch-lab{fill:var(--muted);font-size:11px}
.ch-val{fill:var(--ink);font-size:12px;font-weight:700}
.ch-line{fill:none;stroke:var(--board);stroke-width:2.5;stroke-linejoin:round}
.ch-area{fill:color-mix(in srgb,var(--board) 12%,transparent)}
.ch-dot{fill:var(--surface);stroke:var(--board);stroke-width:2}
.ch-dot.last{fill:var(--chalk);stroke:var(--board)}
.hbars{display:flex;flex-direction:column;gap:10px}
.hbar{display:grid;grid-template-columns:minmax(90px,38%) 1fr auto;gap:10px;align-items:center;font-size:.9rem}
.hb-lab{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb-track{height:10px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.hb-fill{display:block;height:100%;background:var(--board);border-radius:999px}
.hb-val{font-variant-numeric:tabular-nums;font-weight:600;min-width:3.5em;text-align:right}
.cols-chart{display:flex;align-items:flex-end;gap:6px;height:170px;padding-top:10px}
.cc{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;min-width:0}
.cc-bar{width:100%;max-width:28px;background:var(--board);border-radius:6px 6px 2px 2px}
.cc-v{font-size:.72rem;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.cc-l{font-size:.66rem;color:var(--muted);white-space:nowrap}

/* trắc nghiệm */
.setup-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:14px}
.quick{display:flex;flex-direction:column;gap:8px}
.quick-item{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;text-align:left;color:inherit;text-decoration:none}
.quick-item:hover{background:var(--surface-2)}
.quick-item .ic{color:var(--board);width:22px;height:22px}
.quick-item b{display:block}.quick-item small{color:var(--muted)}
.run-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--line)}
.run-head h1{font-size:1.3rem}
.run-meta{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.timer{display:inline-flex;align-items:center;gap:6px;font-size:1.25rem;font-variant-numeric:tabular-nums;padding:6px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
.timer.urgent{color:var(--bad);border-color:var(--bad);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}
.run-body{display:grid;grid-template-columns:1fr 280px;gap:20px;align-items:start}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 24px;display:flex;flex-direction:column;gap:16px}
.q-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.q-no{font-weight:800;font-size:1.15rem;margin-right:6px} .q-no small{color:var(--muted);font-weight:500}
.flag-btn{margin-left:auto;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:none;border-radius:999px;padding:4px 12px;cursor:pointer;font-size:.84rem;color:var(--muted)}
.flag-btn.on{border-color:var(--warn);color:var(--warn);background:color-mix(in srgb,var(--warn) 10%,transparent)}
.q-text{font-size:1.06rem;line-height:1.65}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;gap:12px;padding:11px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;text-align:left;width:100%}
button.opt:hover{border-color:var(--board)}
.opt.sel{border-color:var(--board);background:color-mix(in srgb,var(--board) 9%,var(--surface))}
.opt.sel .opt-l{background:var(--board);color:var(--board-ink)}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 9%,var(--surface))}
.opt.right .opt-l{background:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 8%,var(--surface))}
.opt.wrong .opt-l{background:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.opt-l{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--surface-2);font-weight:700;flex:none}
.tag-ok,.tag-bad{margin-left:auto;font-size:.76rem;font-weight:700;white-space:nowrap}
.tag-ok{color:var(--good)} .tag-bad{color:var(--bad)}
.tfs{display:flex;flex-direction:column;gap:8px}
.tf-row{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px}
.tf-row.right{border-color:color-mix(in srgb,var(--good) 50%,var(--line))}
.tf-row.wrong{border-color:color-mix(in srgb,var(--bad) 55%,var(--line));background:color-mix(in srgb,var(--bad) 5%,transparent)}
.tf-l{font-weight:700;color:var(--muted)}
.tf-btns{display:flex;gap:6px}
.tfb{border:1.5px solid var(--line);background:var(--surface);border-radius:9px;padding:6px 12px;cursor:pointer;font-weight:600;min-width:60px}
.tfb.on.yes{background:var(--good);border-color:var(--good);color:#fff}
.tfb.on.no{background:var(--bad);border-color:var(--bad);color:#fff}
.tf-res{font-size:.84rem;color:var(--muted);white-space:nowrap}
.field.sa .input{max-width:320px}
.q-nav{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding-top:14px}
.navpane{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;position:sticky;top:90px}
.navgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.nb{display:grid;place-items:center;height:36px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:.86rem;font-variant-numeric:tabular-nums}
.nb.ans{background:var(--board);border-color:var(--board);color:var(--board-ink)}
.nb.flag{border-color:var(--warn);box-shadow:inset 0 -3px 0 var(--warn)}
.nb.cur{outline:2px solid var(--chalk);outline-offset:1px}
.legend{font-size:.78rem;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.legend .nb{display:inline-grid;width:22px;height:22px;font-size:.7rem;cursor:default}
.result-hero{display:flex;gap:28px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;flex-wrap:wrap}
.result-hero>div:last-child{display:flex;flex-direction:column;gap:8px;flex:1;min-width:240px}
.score-ring{width:132px;height:132px;border-radius:50%;display:grid;place-items:center;align-content:center;border:10px solid var(--line);flex:none}
.score-ring b{font-size:2.1rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.score-ring small{color:var(--muted)}
.score-ring.good{border-color:var(--good)} .score-ring.fair{border-color:var(--fair)} .score-ring.warn{border-color:var(--warn)} .score-ring.bad{border-color:var(--bad)}
.review{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.rv{border:1px solid var(--line);border-left:4px solid var(--good);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.rv.no{border-left-color:var(--bad)}
.rv-head{display:flex;align-items:center;gap:8px}
.rv-no{font-weight:700}
.rv-pts{margin-left:auto;display:inline-flex;align-items:center;gap:4px;font-weight:600;font-size:.86rem;font-variant-numeric:tabular-nums}
.rv.ok .rv-pts{color:var(--good)} .rv.no .rv-pts{color:var(--bad)}
.explain{background:var(--surface-2);border-radius:10px;padding:10px 14px;font-size:.94rem}
.exam-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.exam{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.exam-top{display:flex;justify-content:space-between;gap:8px}
.exam-act{margin-top:auto}

/* tiện ích */
.tool-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.tool{display:flex;gap:12px;align-items:center;text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer}
.tool:hover{background:var(--surface-2)}
.tool.on{border-color:var(--board);box-shadow:0 0 0 2px color-mix(in srgb,var(--board) 30%,transparent)}
.tool .ic{width:26px;height:26px;color:var(--board)}
.tool b{display:block}.tool small{color:var(--muted);font-size:.82rem}
.tool-panel h2{display:flex;gap:10px;align-items:center}
.tool-panel h2 .ic{color:var(--board)}
.flash-wrap{display:flex;flex-direction:column;align-items:center;gap:16px;padding:10px 0}
.flashcard{position:relative;width:min(440px,100%);height:230px;border:0;background:none;cursor:pointer;perspective:900px;padding:0}
.fc-face{position:absolute;inset:0;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:20px;backface-visibility:hidden;transition:transform .45s;box-shadow:var(--shadow)}
.fc-face.front{background:var(--side-bg);color:var(--side-ink)}
.fc-face.back{background:var(--surface);border:2px solid var(--chalk);transform:rotateY(180deg)}
.flashcard.flip .front{transform:rotateY(180deg)} .flashcard.flip .back{transform:rotateY(360deg)}
.fc-face b{font-size:2rem;text-align:center;line-height:1.2}
.fc-face small{opacity:.75}.fc-face em{font-style:normal;opacity:.7;font-size:.9rem}
.vq{display:flex;flex-direction:column;gap:12px;max-width:620px}
.vq-word{font-size:1.8rem}
.drill-end{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.drill-list{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.drill-list span{padding:3px 10px;border-radius:8px;font-size:.88rem;font-variant-numeric:tabular-nums}
.drill-list .ok{background:color-mix(in srgb,var(--good) 14%,transparent)} .drill-list .no{background:color-mix(in srgb,var(--bad) 14%,transparent)}
.lv-pick{display:flex;flex-direction:column;gap:6px;align-items:flex-start;margin:8px 0 16px}
.drill{display:flex;flex-direction:column;gap:14px;align-items:center;padding:12px 0}
.drill-q{font-size:2.4rem;font-weight:800;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center}
.drill-in{width:150px;font-size:2rem;text-align:center;font-weight:700}
.drill-fb{min-height:1.6em;font-weight:600}.drill-fb.ok{color:var(--good)}.drill-fb.no{color:var(--bad)}
.drill .bar{width:min(420px,100%)}
.calc{max-width:560px;display:flex;flex-direction:column;gap:12px}
.calc-screen{background:var(--side-bg);border-radius:14px;padding:12px}
.calc-in{background:transparent;border:0;color:var(--side-ink);font-size:1.25rem;font-family:var(--mono)}
.calc-in:focus{box-shadow:none}
.calc-out{color:var(--chalk);font-size:1.6rem;font-weight:700;text-align:right;font-variant-numeric:tabular-nums;min-height:1.5em;padding:0 12px;word-break:break-all}
.calc-out.bad{color:#ff9b9b;font-size:1rem}
.calc-keys{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.ck{padding:12px 4px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);cursor:pointer;font-weight:600}
.ck:hover{border-color:var(--board)}
.ck.d{background:var(--surface);font-size:1.05rem}
.ck.eq{background:var(--board);color:var(--board-ink);border-color:var(--board)}
.ck.cl{color:var(--bad)}
.calc-hist{display:flex;flex-direction:column;gap:4px;align-items:flex-start;font-family:var(--mono);font-size:.88rem}
.pt-legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.86rem}
.pt-sw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.ptable{display:grid;grid-template-columns:repeat(18,minmax(42px,1fr));gap:3px;min-width:780px;padding:6px}
.pt-el{aspect-ratio:1;border:0;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;line-height:1.1;padding:2px}
.pt-el small{font-size:.6rem;opacity:.75}.pt-el b{font-size:.95rem}.pt-el em{font-style:normal;font-size:.56rem;opacity:.8}
.pt-el.empty{background:var(--surface-2);opacity:.45;cursor:default}
.pt-el:not(.empty):hover{outline:2px solid var(--ink)}
.pt-gap{visibility:hidden}
.kl,.pt-sw.kl{background:color-mix(in srgb,var(--s-toan) 22%,var(--surface))}
.pk,.pt-sw.pk{background:color-mix(in srgb,var(--s-khtn) 26%,var(--surface))}
.ak,.pt-sw.ak{background:color-mix(in srgb,var(--s-khxh) 28%,var(--surface))}
.kh,.pt-sw.kh{background:color-mix(in srgb,var(--s-van) 22%,var(--surface))}
.pt-big{font-size:1.4rem}
.units-row{display:grid;grid-template-columns:1.2fr 1fr auto 1fr;gap:10px;align-items:center;max-width:640px}
.units-out{font-size:1.3rem;padding:8px 0}
.units-out b{color:var(--board);font-variant-numeric:tabular-nums}
.pomo{display:flex;flex-direction:column;align-items:center;gap:16px}
.pomo-ring{--p:0;width:220px;height:220px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--chalk) calc(var(--p)*360deg),var(--surface-2) 0)}
.pomo-ring>div{width:180px;height:180px;border-radius:50%;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center}
.pomo-ring b{font-size:2.6rem;font-variant-numeric:tabular-nums}
.small-inputs{max-width:320px}
.notes{display:grid;grid-template-columns:260px 1fr;gap:16px}
.notes aside{display:flex;flex-direction:column;gap:10px}
.note-ed{display:flex;flex-direction:column;gap:10px}
.todo-add{display:grid;grid-template-columns:1fr 170px auto;gap:8px}
.todos{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column}
.todos li{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line)}
.todos li label{flex:1;display:flex;gap:10px;align-items:center;cursor:pointer}
.todos li input{width:18px;height:18px;accent-color:var(--board)}
.todos li.done span{text-decoration:line-through;color:var(--muted)}
.cd-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.cd-card{background:var(--side-bg);color:var(--side-ink);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.cd-card .muted{color:var(--side-muted)}
.cd-units{display:flex;gap:14px}
.cd-units span{display:flex;flex-direction:column;align-items:center;font-size:.76rem;color:var(--side-muted)}
.cd-units b{font-size:1.9rem;color:var(--chalk);font-variant-numeric:tabular-nums;line-height:1.1}
.tool-panel h3{margin-top:8px}

/* quản trị */
.admin-tabs{margin-top:-6px;flex-wrap:wrap}
.qlist{display:flex;flex-direction:column;gap:10px}
.qrow{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.qrow-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.qrow-foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.opt-edit{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.opt-edit input[type=radio]{width:18px;height:18px;accent-color:var(--good)}
.pick-list{max-height:340px;overflow-y:auto;border:1px solid var(--line);border-radius:10px}
.pick{display:flex;gap:10px;align-items:flex-start;padding:8px 12px;border-bottom:1px solid var(--line);cursor:pointer;font-size:.9rem}
.pick:last-child{border-bottom:0}
.pick input{margin-top:4px;accent-color:var(--board)}

/* hộp thoại, thông báo */
.modal-back{position:fixed;inset:0;background:rgba(8,16,12,.5);display:grid;place-items:center;padding:16px;z-index:50;animation:fadeIn .15s}
@keyframes fadeIn{from{opacity:0}}
.modal{background:var(--surface);color:var(--ink);border-radius:16px;width:min(520px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal.wide{width:min(860px,100%)}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal-body{padding:18px 20px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
#toasts{position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column;gap:8px;z-index:60;max-width:min(380px,calc(100vw - 40px))}
.toast{background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.25);font-size:.92rem;transition:opacity .3s,transform .3s;border-left:4px solid var(--chalk)}
.toast.ok{border-left-color:#5ad69b}.toast.bad{border-left-color:#ff7b7b}.toast.warn{border-left-color:var(--chalk)}
.toast.out{opacity:0;transform:translateY(8px)}


/* nút đổi giao diện, tin tức, khách */
.theme-btn{display:flex;align-items:center;gap:10px;width:100%;padding:8px 12px;border-radius:10px;border:1px solid color-mix(in srgb,var(--side-ink) 18%,transparent);background:transparent;color:var(--side-muted);cursor:pointer;font-size:.86rem;text-align:left}
.theme-btn:hover{background:var(--side-hover);color:var(--side-ink)}
.theme-btn b{color:var(--side-ink);font-weight:600}
.topbar .icon-btn{margin-left:auto;color:var(--side-ink)}
.auth-tools{position:fixed;top:14px;right:14px;z-index:5}
.auth-tools .theme-btn{width:auto;background:var(--surface);color:var(--ink);border-color:var(--line);box-shadow:var(--shadow)}
.auth-tools .theme-btn b{color:var(--ink)}
.mode-pill.public::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#7cc4ff;margin-right:6px;vertical-align:1px}
.me .btn.sm{white-space:nowrap}
.update-bar{display:flex;align-items:center;justify-content:center;gap:12px;padding:8px 16px;background:color-mix(in srgb,var(--chalk) 22%,var(--surface));border-bottom:1px solid var(--line);font-weight:600;flex-wrap:wrap}
.update-bar[hidden]{display:none}
.grade-pick{border:2px solid var(--chalk)}
.lv-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.lv-row .lv-name{min-width:80px}
.loading.small{padding:16px;font-size:.9rem}
.feed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.feed li a{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:baseline;padding:10px 4px;border-bottom:1px solid var(--line);color:inherit;text-decoration:none}
.feed li:last-child a{border-bottom:0}
.feed li a:hover .feed-t{color:var(--board);text-decoration:underline}
.feed-t{font-weight:500;line-height:1.45}
.feed small{color:var(--muted);white-space:nowrap;font-size:.8rem}
.src{font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:6px;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.src[data-src="VnExpress"]{background:color-mix(in srgb,#9f224e 14%,transparent);color:color-mix(in srgb,#9f224e 80%,var(--ink))}
.src[data-src="Tuổi Trẻ"]{background:color-mix(in srgb,#0f62ac 14%,transparent);color:color-mix(in srgb,#0f62ac 80%,var(--ink))}
.src[data-src="Thanh Niên"]{background:color-mix(in srgb,#d0021b 12%,transparent);color:color-mix(in srgb,#d0021b 78%,var(--ink))}
.feed-note{margin-top:8px}
@media (max-width:560px){ .feed li a{grid-template-columns:1fr} .feed small{white-space:normal} .auth-tools{position:static;display:flex;justify-content:flex-end;padding:10px 16px 0} }

/* màn hình hẹp */

  .subj-cards{grid-template-columns:repeat(3,1fr)}

  .kpis{grid-template-columns:repeat(2,1fr)}
}

  .topbar-title{font-weight:700}

  .run-body{grid-template-columns:1fr}
  .navpane{position:static}
  .run-head{top:52px}
  .auth-wrap{grid-template-columns:1fr}
  .auth-side{padding:32px 24px}

}
@media (max-width:560px){
  h1{font-size:1.4rem}
  .subj-cards{grid-template-columns:repeat(2,1fr)}
  .row2,.row3,.todo-add,.units-row{grid-template-columns:1fr}
  .kpis{grid-template-columns:1fr 1fr}
  .kpi-val{font-size:1.4rem}
  .card,.reader,.qcard{padding:16px}
  .tf-row{grid-template-columns:auto 1fr}
  .tf-btns,.tf-res{grid-column:2}
  .navgrid{grid-template-columns:repeat(8,1fr)}
  .calc-keys{grid-template-columns:repeat(4,1fr)}
  .hero{padding:18px}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

/* ===== Học theo từng bài (lessons.js) ===== */
.row-gap{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.units{display:flex;flex-direction:column;gap:12px}
.unit{border:1px solid var(--line);border-radius:12px;padding:14px 18px;background:var(--surface)}
.unit.done{background:color-mix(in srgb,var(--good) 5%,var(--surface));border-color:color-mix(in srgb,var(--good) 28%,var(--line))}
.unit.flash{animation:flash 1.6s ease}
.lrows{display:flex;flex-direction:column;gap:4px;margin:4px 0}
.lrow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:9px 12px;border-radius:10px;text-decoration:none;color:inherit;border:1px solid transparent}
.lrow:hover{background:var(--surface-2);border-color:var(--line)}
.lno{font-weight:700;color:var(--c);font-size:.86rem;white-space:nowrap;min-width:4.2em}
.lt{font-weight:500}
.lst{font-size:.76rem;font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px}
.lst svg{width:14px;height:14px}
.lst.ok{color:var(--good);background:color-mix(in srgb,var(--good) 12%,transparent)}
.lst.rd{color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent)}
.lst.wip{color:var(--muted);background:var(--surface-2)}
.keypts{margin-top:6px}.keypts summary{cursor:pointer;color:var(--muted);font-weight:600;font-size:.9rem;padding:4px 0}
.keypts .points{margin-top:6px}
.lesson-page{max-width:920px}
.crumbs{color:var(--muted)}.crumbs a{color:inherit}
.lesson-head{display:flex;flex-direction:column;gap:10px;border-left:6px solid var(--c);padding:4px 0 4px 16px}
.lesson-head h1{font-size:1.75rem;line-height:1.25}
.lesson-head .lead{color:var(--muted);font-size:1.05rem;max-width:70ch}
.toc .chip{text-decoration:none;color:inherit}
.good-btn{background:var(--good);color:#fff;border-color:var(--good)}
.goals{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px}
.goals li::marker{content:'✓  ';color:var(--good);font-weight:700}
.th h3{font-size:1.02rem;margin:4px 0 6px;color:var(--c)}
.th + .th{border-top:1px dashed var(--line);padding-top:10px}
.example{border:1px solid var(--line);border-radius:12px;padding:12px 16px;display:flex;flex-direction:column;gap:8px;align-items:flex-start;background:var(--surface)}
.ex-q{margin:0}
.ex-sol{width:100%;background:var(--surface-2);border-radius:10px;padding:10px 14px}
.steps{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:4px}
.ex-ans{margin:8px 0 0}
.h-sm{font-size:1.05rem;margin-bottom:6px}
.lp-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.lp{border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.lp.ok{border-color:color-mix(in srgb,var(--good) 45%,var(--line))}
.lp.no{border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.lp-head{display:flex;gap:8px;align-items:center}
.lp-act{display:flex;gap:8px;flex-wrap:wrap}
.sa-in{max-width:320px}
.sa-in.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 8%,var(--surface))}
.sa-in.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 7%,var(--surface))}
.sol{margin-top:6px}
b.good{color:var(--good)} b.bad{color:var(--bad)} b.fair{color:var(--fair)}
.lp-score{font-size:1.05rem;padding:10px 14px;border-radius:12px;background:var(--surface-2);border-left:5px solid var(--muted);margin-bottom:8px}
.lp-score b{font-size:1.4rem}
.lp-score.good{border-left-color:var(--good)} .lp-score.fair{border-left-color:var(--fair)} .lp-score.warn{border-left-color:var(--warn)} .lp-score.bad{border-left-color:var(--bad)}
.essay{display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.essay-fb{display:flex;flex-direction:column;gap:10px}
.rubric{display:flex;flex-direction:column;gap:6px;background:var(--surface-2);border-radius:10px;padding:10px 14px}
.rb{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;cursor:pointer}
.rb-score{margin-top:4px}
.lesson-nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.lesson-nav .btn{max-width:48%;white-space:normal;text-align:left}
.doc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.doc-subj{background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--c);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.doc-subj h3{font-size:1rem;margin:4px 0 0}
.doc-subj .sc-tag{color:var(--c);font-weight:800}
.mk-card .card-head h2{font-size:1.05rem}
.fig{margin:8px 0 4px;display:flex;flex-direction:column;align-items:center;gap:6px}
.fig img{max-width:min(100%,640px);height:auto;border-radius:12px;background:#fff;border:1px solid var(--line);padding:6px}
.fig figcaption{font-size:.88rem;color:var(--muted);text-align:center;max-width:60ch}
.figs-card{align-items:center}
.paper .fig img{max-width:440px;border:0;padding:0}
.paper .fig figcaption{color:#555}
/* Trang in */
.print-page{max-width:900px}
.print-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.paper{background:#fff;color:#111;border:1px solid var(--line);border-radius:12px;padding:32px 40px;font-size:15px;line-height:1.6}
.paper h1{font-size:1.5rem;margin:6px 0 4px;color:#111}
.paper h2{font-size:1.15rem;margin:18px 0 6px;border-bottom:1px solid #ccc;padding-bottom:3px;color:#111}
.paper h3{font-size:1.02rem;margin:12px 0 4px;color:#111}
.paper h4{font-size:.98rem;margin:10px 0 2px;color:#222}
.paper ul,.paper ol{padding-left:1.3em;margin:4px 0}
.p-head{display:flex;justify-content:space-between;font-size:.8rem;color:#555;border-bottom:2px solid #1f5640;padding-bottom:4px}
.p-brand{font-weight:800;color:#1f5640}
.p-sub,.p-note{color:#444}
.p-h{font-weight:700;margin:6px 0 2px}
.p-qs>li{margin:10px 0}
.p-opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 24px;margin:4px 0}
.p-tf{border-collapse:collapse;margin:4px 0}.p-tf td{padding:2px 8px;vertical-align:top}.p-box{white-space:nowrap}
.p-line{margin:4px 0;color:#444}
.p-ex{margin:8px 0;padding:6px 12px;border-left:3px solid #ccc}
.p-unit{break-inside:avoid-page}
.p-foot{margin-top:24px;font-size:.78rem;color:#666;border-top:1px solid #ccc;padding-top:6px}
.p-break{height:0}
/* Trợ lý AI */
.ai-fab{position:fixed;right:18px;bottom:18px;z-index:60;display:inline-flex;align-items:center;gap:8px;padding:11px 16px;border-radius:999px;border:0;background:var(--board);color:var(--board-ink);font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.22);cursor:pointer}
.ai-fab svg{width:18px;height:18px}
.ai-fab.on{background:var(--chalk);color:var(--chalk-ink)}
.ai-panel{position:fixed;right:18px;bottom:78px;z-index:61;width:min(420px,calc(100vw - 24px));max-height:min(640px,calc(100vh - 110px));display:flex;flex-direction:column;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 48px rgba(0,0,0,.28);overflow:hidden}
.ai-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:12px 14px;background:var(--board);color:var(--board-ink)}
.ai-head small{display:block;opacity:.85;font-size:.76rem}
.ai-head .icon-btn{color:inherit}
.ai-ctx{padding:6px 14px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.ai-body{flex:1;overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.ai-msg{max-width:92%;padding:9px 12px;border-radius:14px;line-height:1.5}
.ai-msg p{margin:0 0 6px}.ai-msg p:last-child{margin:0}.ai-msg ul{margin:4px 0;padding-left:1.2em}
.ai-msg.user{align-self:flex-end;background:color-mix(in srgb,var(--board) 14%,var(--surface));border-bottom-right-radius:4px}
.ai-msg.assistant{align-self:flex-start;background:var(--surface-2);border-bottom-left-radius:4px}
.ai-msg.typing span{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:var(--muted);animation:aidot 1s infinite}
.ai-msg.typing span:nth-child(2){animation-delay:.15s}.ai-msg.typing span:nth-child(3){animation-delay:.3s}
@keyframes aidot{0%,80%,100%{opacity:.25}40%{opacity:1}}
.ai-form{display:grid;grid-template-columns:1fr auto;gap:8px;padding:10px 12px;border-top:1px solid var(--line);align-items:end}
.ai-attach{grid-column:1/-1;background:var(--surface-2);border-radius:8px;padding:5px 8px}
.ai-note{margin:0;padding:0 14px 10px;color:var(--muted)}
.ai-soon{text-align:center;padding:10px 6px}
.ai-big svg{width:40px;height:40px;color:var(--chalk)}
.ai-grade{background:var(--surface-2);border-radius:10px;padding:10px 14px}
@media (max-width:640px){.lrow{grid-template-columns:auto 1fr}.lrow .lst{grid-column:2;justify-self:start}.ai-fab span{display:none}.ai-fab{padding:13px}.paper{padding:18px}.p-opts{grid-template-columns:1fr}.lesson-nav .btn{max-width:100%}}
@media print{
  .side,.topbar,.top,header.top,.ai-fab,.ai-panel,#ai-host,.no-print,.update-bar,.toast-host,nav.nav{display:none!important}
  body,html{background:#fff!important}
  .shell,.main,#main,.page,.main-wrap{display:block!important;margin:0!important;padding:0!important;max-width:none!important}
  .side-scrim{display:none!important}
  .paper{border:0;padding:0;font-size:12.5pt}
  .p-break{break-before:page}
  a{color:inherit;text-decoration:none}
}
/* Dạng bài: sắp xếp, nối cột, các dạng bài tập */
.ord-line{display:flex;flex-wrap:wrap;gap:6px;min-height:44px;padding:8px;border:1.5px dashed var(--line);border-radius:12px;margin:6px 0 10px;background:var(--surface-2)}
.ord-line.right{border-color:var(--good);border-style:solid} .ord-line.wrong{border-color:var(--bad);border-style:solid}
.ord-ph{color:var(--muted);font-size:.9rem;align-self:center}
.ord-pool{display:flex;flex-wrap:wrap;gap:8px}
.chip-btn{font:inherit;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;position:relative}
.chip-btn:hover{border-color:var(--c,var(--good))} .chip-btn.on{opacity:.45} .chip-btn:disabled{cursor:default}
.chip-btn.on::after{content:attr(data-pos);position:absolute;top:-8px;right:-6px;background:var(--c,var(--good));color:#fff;border-radius:999px;font-size:.7rem;min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px}
.ord-it{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);margin:2px}
.ord-it small{background:color-mix(in srgb,var(--c,var(--good)) 18%,transparent);border-radius:999px;padding:0 6px;font-weight:600}
.ord-key{margin-top:6px}
.match{display:flex;flex-direction:column;gap:8px}
.m-row{display:grid;grid-template-columns:1fr minmax(160px,46%);gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:12px}
.m-row.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 7%,transparent)} .m-row.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 6%,transparent)}
.m-row .tf-res{grid-column:1/-1}
@media (max-width:640px){.m-row{grid-template-columns:1fr}}
.types{display:flex;flex-direction:column;gap:8px}
.dtype{border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--surface)}
.dtype[open]{border-color:color-mix(in srgb,var(--c,var(--good)) 45%,var(--line))}
.dtype summary{cursor:pointer;font-weight:600;display:flex;gap:10px;align-items:center;list-style:none}
.dtype summary::-webkit-details-marker{display:none}
.dt-no{flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:color-mix(in srgb,var(--c,var(--good)) 16%,transparent);color:var(--c,var(--good));font-size:.85rem}
.dtype .steps{margin:8px 0 2px}
.p-chip{display:inline-block;border:1px solid #999;border-radius:12px;padding:1px 8px;margin:2px}
