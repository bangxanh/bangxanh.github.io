   <g id="text_1">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1b2620" x="274.752" y="34.454906" transform="rotate(-0 274.752 34.454906)">Đa thức cần phân tích thành nhân tử</text>
   </g>
   <g id="text_2">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1b2620" x="98.73" y="83.70327" transform="rotate(-0 98.73 83.70327)">1. Có nhân tử chung?</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #2f6fde" x="98.73" y="103.734281" transform="rotate(-0 98.73 103.734281)">Đặt nhân tử chung</text>
   </g>
   <g id="text_4">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1b2620" x="98.73" y="158.447602" transform="rotate(-0 98.73 158.447602)">6x³y − 9x²y² = 3x²y(2x − 3y)</text>
   </g>
   <g id="text_5">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1b2620" x="274.752" y="84.179871" transform="rotate(-0 274.752 84.179871)">2. Có dạng hằng đẳng thức?</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #bd7a12" x="274.752" y="104.428969" transform="rotate(-0 274.752 104.428969)">Dùng hằng đẳng thức</text>
   </g>
   <g id="text_7">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1b2620" x="274.752" y="158.847094" transform="rotate(-0 274.752 158.847094)">9x² − 4 = (3x − 2)(3x + 2)</text>
   </g>
   <g id="text_8">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1b2620" x="450.774" y="83.439949" transform="rotate(-0 450.774 83.439949)">3. Chưa được?</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #55891b" x="450.774" y="103.734281" transform="rotate(-0 450.774 103.734281)">Nhóm hạng tử</text>
   </g>
   <g id="text_10">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #1b2620" transform="translate(403.242633 143.135648)">x² − xy + 2x − 2y</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #1b2620" transform="translate(394.426734 158.447602)">= x(x − y) + 2(x − y)</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #1b2620" transform="translate(408.377789 173.672602)">= (x − y)(x + 2)</text>
   </g>
   <g id="text_11">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #1b2620" transform="translate(82.083562 225.373248)">Kiểm tra: nhân các nhân tử phải được đa thức ban đầu; phân tích đến khi</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #1b2620" transform="translate(58.191961 239.18526)">mỗi nhân tử không phân tích tiếp được nữa (thường phối hợp cả ba phương pháp).</text>
   </g>
  </g>
