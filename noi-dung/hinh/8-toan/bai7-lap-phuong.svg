   <g id="text_8">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #c93a58" x="197.325077" y="48.282532" transform="rotate(-0 197.325077 48.282532)">(a + b)³ = a³ + 3a²b + 3ab² + b³</text>
   </g>
   <g id="text_9">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1b2620" x="197.325077" y="71.969557" transform="rotate(-0 197.325077 71.969557)">Khối lập phương cạnh a + b được chia thành 8 khối hộp:</text>
   </g>
   <g id="text_10">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1b2620" x="197.325077" y="89.734826" transform="rotate(-0 197.325077 89.734826)">1 khối a³ + 3 khối a²b + 3 khối ab² + 1 khối b³</text>
   </g>
   <g id="text_11">
