    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #1b2620" transform="translate(33.760405 78.254695)">1. Đề xuất</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #1b2620" transform="translate(43.230913 91.769754)">vấn đề</text>
   </g>
   <g id="text_2">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #1b2620" transform="translate(147.253523 78.044285)">2. Đưa ra</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #1b2620" transform="translate(150.168913 91.067156)">dự đoán</text>
   </g>
   <g id="text_3">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #1b2620" transform="translate(265.907227 78.011063)">3. Lập</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #1b2620" transform="translate(258.150352 91.521199)">kế hoạch</text>
   </g>
   <g id="text_4">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #1b2620" transform="translate(360.09593 78.011063)">4. Thực hiện</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #1b2620" transform="translate(368.623079 91.521199)">kế hoạch</text>
   </g>
   <g id="text_5">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #1b2620" transform="translate(462.021001 78.445008)">5. Viết báo cáo,</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #1b2620" transform="translate(478.191822 91.57452)">thảo luận</text>
   </g>
   <g id="text_6">
    <text style="font-size: 9.4px; font-family: 'DejaVu Sans'; fill: #1b2620" transform="translate(25.63028 143.2698)">Hạt đậu có cần</text>
    <text style="font-size: 9.4px; font-family: 'DejaVu Sans'; fill: #1b2620" transform="translate(16.168592 156.385737)">nước để nảy mầm?</text>
   </g>
   <g id="text_7">
    <text style="font-size: 9.4px; font-family: 'DejaVu Sans'; fill: #1b2620" transform="translate(135.32971 142.932722)">Không có nước,</text>
    <text style="font-size: 9.4px; font-family: 'DejaVu Sans'; fill: #1b2620" transform="translate(124.189241 156.313034)">hạt không nảy mầm</text>
   </g>
   <g id="text_8">
    <text style="font-size: 9.4px; font-family: 'DejaVu Sans'; fill: #1b2620" transform="translate(235.610781 143.225737)">2 cốc bông ẩm/khô,</text>
    <text style="font-size: 9.4px; font-family: 'DejaVu Sans'; fill: #1b2620" transform="translate(230.076531 156.445956)">cùng số hạt, cùng chỗ</text>
   </g>
   <g id="text_9">
    <text style="font-size: 9.4px; font-family: 'DejaVu Sans'; fill: #1b2620" transform="translate(353.16068 142.932722)">Theo dõi 5 ngày,</text>
    <text style="font-size: 9.4px; font-family: 'DejaVu Sans'; fill: #1b2620" transform="translate(345.587071 156.313034)">ghi số hạt nảy mầm</text>
   </g>
   <g id="text_10">
    <text style="font-size: 9.4px; font-family: 'DejaVu Sans'; fill: #1b2620" transform="translate(460.153205 143.225737)">Cốc ẩm nảy mầm,</text>
    <text style="font-size: 9.4px; font-family: 'DejaVu Sans'; fill: #1b2620" transform="translate(450.008548 156.310831)">cốc khô không ⇒ đúng</text>
   </g>
