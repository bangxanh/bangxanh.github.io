   <g id="text_1">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #55626b" x="22.5" y="31.161656" transform="rotate(-0 22.5 31.161656)">Kim loại</text>
   </g>
   <g id="text_2">
    <text style="font-size: 9.8px; font-family: 'DejaVu Sans'" transform="translate(22.5 59.784187)">dẫn điện, dẫn nhiệt</text>
    <text style="font-size: 9.8px; font-family: 'DejaVu Sans'" transform="translate(22.5 73.341875)">tốt; dễ uốn</text>
    <text style="font-size: 9.8px; font-family: 'DejaVu Sans'" transform="translate(22.5 85.983875)">→ nồi, dây điện</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #2f6fde" x="198.522" y="31.161656" transform="rotate(-0 198.522 31.161656)">Nhựa</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9.8px; font-family: 'DejaVu Sans'" transform="translate(198.522 59.645609)">nhẹ, bền, cách điện;</text>
    <text style="font-size: 9.8px; font-family: 'DejaVu Sans'" transform="translate(198.522 72.573953)">khó phân hủy</text>
    <text style="font-size: 9.8px; font-family: 'DejaVu Sans'" transform="translate(198.522 85.803953)">→ vỏ dây, chai, hộp</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #4a3a2a" x="374.544" y="31.161187" transform="rotate(-0 374.544 31.161187)">Cao su</text>
   </g>
   <g id="text_6">
    <text style="font-size: 9.8px; font-family: 'DejaVu Sans'" transform="translate(374.544 59.523875)">đàn hồi, không</text>
    <text style="font-size: 9.8px; font-family: 'DejaVu Sans'" transform="translate(374.544 73.700953)">thấm nước</text>
    <text style="font-size: 9.8px; font-family: 'DejaVu Sans'" transform="translate(374.544 85.981578)">→ lốp xe, ủng</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #0b879a" x="22.5" y="130.068281" transform="rotate(-0 22.5 130.068281)">Thủy tinh</text>
   </g>
   <g id="text_8">
    <text style="font-size: 9.8px; font-family: 'DejaVu Sans'" transform="translate(22.5 157.927578)">trong suốt,</text>
    <text style="font-size: 9.8px; font-family: 'DejaVu Sans'" transform="translate(22.5 171.298453)">giòn, dễ vỡ</text>
    <text style="font-size: 9.8px; font-family: 'DejaVu Sans'" transform="translate(22.5 184.331688)">→ cửa kính, lọ</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #b5651d" x="198.522" y="130.243594" transform="rotate(-0 198.522 130.243594)">Gốm sứ</text>
   </g>
   <g id="text_10">
    <text style="font-size: 9.8px; font-family: 'DejaVu Sans'" transform="translate(198.522 157.700187)">cứng, chịu nhiệt,</text>
    <text style="font-size: 9.8px; font-family: 'DejaVu Sans'" transform="translate(198.522 171.051922)">cách điện</text>
    <text style="font-size: 9.8px; font-family: 'DejaVu Sans'" transform="translate(198.522 184.160188)">→ bát, gạch, ngói</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #8a5a2b" x="374.544" y="130.328906" transform="rotate(-0 374.544 130.328906)">Gỗ</text>
   </g>
   <g id="text_12">
    <text style="font-size: 9.8px; font-family: 'DejaVu Sans'" transform="translate(374.544 158.068453)">dễ gia công,</text>
    <text style="font-size: 9.8px; font-family: 'DejaVu Sans'" transform="translate(374.544 171.298453)">dễ cháy, mối mọt</text>
    <text style="font-size: 9.8px; font-family: 'DejaVu Sans'" transform="translate(374.544 184.387578)">→ bàn ghế, nhà</text>
   </g>
  </g>
 </g>
