   <g id="text_3">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; fill: #c93a58" transform="translate(14.184 77.486551)">Vật sống</text>
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; fill: #c93a58" transform="translate(14.184 90.892371)">(hữu sinh)</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; fill: #6b7a72" transform="translate(14.184 158.451234)">Vật không</text>
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; fill: #6b7a72" transform="translate(14.184 172.893461)">sống</text>
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; fill: #6b7a72" transform="translate(14.184 186.536469)">(vô sinh)</text>
   </g>
   <g id="text_5">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(142.309187 70.237375)">cây bàng, con mèo,</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(142.484187 85.049094)">vi khuẩn, con người</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(148.512312 99.361594)">(tạo nên từ nước,</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(144.220125 113.737375)">protein, tinh bột…)</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(146.688875 164.485375)">hòn đá, sông, núi,</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(167.083406 178.985375)">không khí</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(136.070906 193.485375)">(đá vôi, nước, oxygen,</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(163.699031 207.785375)">nitrogen…)</text>
   </g>
   <g id="text_7">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(343.514531 84.737375)">(con người không tạo</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(366.480937 99.469406)">ra vật sống)</text>
   </g>
   <g id="text_8">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(333.977812 172.121312)">cái bàn (gỗ), xe đạp (sắt,</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(337.185625 186.467406)">cao su), cốc (thủy tinh),</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(354.128594 200.659594)">chai nhựa (nhựa)</text>
   </g>
